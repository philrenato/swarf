<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- swarf app icon. Same language as the tab favicon in web/kiri/index.html:
       bone wordmark letter on a warm near-black plate, mill-red HUD corner
       brackets, and the asymmetric chamfer (top-left + bottom-right cut) that
       runs through every swarf panel. The red under-glow echoes the wordmark,
       where "arf" is the half that lights up. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#141010"/>
      <stop offset="0.55" stop-color="#0a0808"/>
      <stop offset="1"    stop-color="#120b0a"/>
    </linearGradient>
    <radialGradient id="leak" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0"   stop-color="#ff3a2a" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#d02020" stop-opacity="0.08"/>
      <stop offset="1"   stop-color="#d02020" stop-opacity="0"/>
    </radialGradient>
    <!-- asymmetric chamfer: top-left and bottom-right corners cut -->
    <clipPath id="chamfer">
      <path d="M104 24 H488 V408 L408 488 H24 V104 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#chamfer)">
    <rect width="512" height="512" fill="url(#plate)"/>
    <ellipse cx="256" cy="318" rx="210" ry="170" fill="url(#leak)"/>
    <!-- scanline texture, the degraded-signal register -->
    <g fill="#d8d2c6" opacity="0.025">
      <rect x="0" y="0"   width="512" height="1"/><rect x="0" y="8"   width="512" height="1"/>
      <rect x="0" y="16"  width="512" height="1"/><rect x="0" y="24"  width="512" height="1"/>
      <rect x="0" y="32"  width="512" height="1"/><rect x="0" y="40"  width="512" height="1"/>
      <rect x="0" y="48"  width="512" height="1"/><rect x="0" y="56"  width="512" height="1"/>
      <rect x="0" y="64"  width="512" height="1"/><rect x="0" y="72"  width="512" height="1"/>
      <rect x="0" y="80"  width="512" height="1"/><rect x="0" y="88"  width="512" height="1"/>
      <rect x="0" y="96"  width="512" height="1"/><rect x="0" y="104" width="512" height="1"/>
      <rect x="0" y="112" width="512" height="1"/><rect x="0" y="120" width="512" height="1"/>
      <rect x="0" y="128" width="512" height="1"/><rect x="0" y="136" width="512" height="1"/>
      <rect x="0" y="144" width="512" height="1"/><rect x="0" y="152" width="512" height="1"/>
      <rect x="0" y="160" width="512" height="1"/><rect x="0" y="168" width="512" height="1"/>
      <rect x="0" y="176" width="512" height="1"/><rect x="0" y="184" width="512" height="1"/>
      <rect x="0" y="192" width="512" height="1"/><rect x="0" y="200" width="512" height="1"/>
      <rect x="0" y="208" width="512" height="1"/><rect x="0" y="216" width="512" height="1"/>
      <rect x="0" y="224" width="512" height="1"/><rect x="0" y="232" width="512" height="1"/>
      <rect x="0" y="240" width="512" height="1"/><rect x="0" y="248" width="512" height="1"/>
      <rect x="0" y="256" width="512" height="1"/><rect x="0" y="264" width="512" height="1"/>
      <rect x="0" y="272" width="512" height="1"/><rect x="0" y="280" width="512" height="1"/>
      <rect x="0" y="288" width="512" height="1"/><rect x="0" y="296" width="512" height="1"/>
      <rect x="0" y="304" width="512" height="1"/><rect x="0" y="312" width="512" height="1"/>
      <rect x="0" y="320" width="512" height="1"/><rect x="0" y="328" width="512" height="1"/>
      <rect x="0" y="336" width="512" height="1"/><rect x="0" y="344" width="512" height="1"/>
      <rect x="0" y="352" width="512" height="1"/><rect x="0" y="360" width="512" height="1"/>
      <rect x="0" y="368" width="512" height="1"/><rect x="0" y="376" width="512" height="1"/>
      <rect x="0" y="384" width="512" height="1"/><rect x="0" y="392" width="512" height="1"/>
      <rect x="0" y="400" width="512" height="1"/><rect x="0" y="408" width="512" height="1"/>
      <rect x="0" y="416" width="512" height="1"/><rect x="0" y="424" width="512" height="1"/>
      <rect x="0" y="432" width="512" height="1"/><rect x="0" y="440" width="512" height="1"/>
      <rect x="0" y="448" width="512" height="1"/><rect x="0" y="456" width="512" height="1"/>
      <rect x="0" y="464" width="512" height="1"/><rect x="0" y="472" width="512" height="1"/>
      <rect x="0" y="480" width="512" height="1"/><rect x="0" y="488" width="512" height="1"/>
      <rect x="0" y="496" width="512" height="1"/><rect x="0" y="504" width="512" height="1"/>
    </g>
    <!-- the cut edges, lit -->
    <path d="M104 24 L24 104" stroke="#ff3a2a" stroke-width="7" fill="none"/>
    <path d="M488 408 L408 488" stroke="#ff3a2a" stroke-width="7" fill="none"/>
    <!-- HUD corner brackets, opposite the chamfers -->
    <path d="M488 74 V24 H438" stroke="#8f3020" stroke-width="7" fill="none"/>
    <path d="M24 438 V488 H74" stroke="#8f3020" stroke-width="7" fill="none"/>
    <!-- the letter: bone, with the crimson leak reading through from below -->
    <text x="256" y="352" font-family="Menlo, ui-monospace, monospace"
          font-size="330" font-weight="700" text-anchor="middle"
          fill="#d8d2c6">s</text>
  </g>
</svg>

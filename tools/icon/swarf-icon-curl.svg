<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- swarf app icon. The name IS the object: the curl of material a cutter
       leaves on the floor. The shaving is drawn in three-quarter view, not
       flat on, so it reads as a chip rather than a target. Mill-red on the
       warm near-black plate, with the asymmetric chamfer (top-left,
       bottom-right) that runs through every swarf panel. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#161011"/>
      <stop offset="0.55" stop-color="#0a0808"/>
      <stop offset="1"    stop-color="#130b0a"/>
    </linearGradient>
    <radialGradient id="leak" cx="0.45" cy="0.46" r="0.5">
      <stop offset="0"    stop-color="#ff3a2a" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#d02020" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#d02020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#ff6a48"/>
      <stop offset="0.38" stop-color="#e8331f"/>
      <stop offset="0.72" stop-color="#8f1a12"/>
      <stop offset="1"    stop-color="#ff4a30"/>
    </linearGradient>
    <clipPath id="chamfer">
      <path d="M104 24 H488 V408 L408 488 H24 V104 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#chamfer)">
    <rect width="512" height="512" fill="url(#plate)"/>
    <ellipse cx="230" cy="236" rx="200" ry="190" fill="url(#leak)"/>

